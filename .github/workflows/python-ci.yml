name: Python CI

on:
  pull_request:
    paths:
      - 'app_python/**'
      - '.github/workflows/python-ci.yml'
      - 'requirements.txt'
  push:
    branches:
      - main
      - master
    paths:
      - 'app_python/**'
      - '.github/workflows/python-ci.yml'
      - 'requirements.txt'

jobs:
  test:
    name: Test Python Application
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'app_python/requirements.txt'

      - name: Install dependencies
        working-directory: ./app_python
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint with Pylint
        working-directory: ./app_python
        run: |
          pylint app.py --rcfile=.pylintrc

      - name: Run tests with pytest
        working-directory: ./app_python
        run: |
          pytest --cov=app --cov-report=xml --cov-report=term --cov-report=term-missing

      - name: Display coverage summary
        working-directory: ./app_python
        run: |
          echo "## Python Test Coverage Summary" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          coverage report --format=total >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Detailed Coverage" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          coverage report >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          file: ./app_python/coverage.xml
          flags: python
          name: python-coverage
          fail_ci_if_error: false

      - name: Run Snyk to check for vulnerabilities
        uses: snyk/actions/python-3.10@master
        continue-on-error: true
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --severity-threshold=high --file=app_python/requirements.txt

  docker:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./app_python
          file: ./app_python/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/moscow-time-app:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/moscow-time-app:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push Distroless image
        uses: docker/build-push-action@v5
        with:
          context: ./app_python
          file: ./app_python/distroless.Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/moscow-time-app-distroless:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/moscow-time-app-distroless:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
