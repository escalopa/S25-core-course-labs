name: Go CI

on:
  pull_request:
    paths:
      - 'app_go/**'
      - '.github/workflows/go-ci.yml'
  push:
    branches:
      - main
      - master
    paths:
      - 'app_go/**'
      - '.github/workflows/go-ci.yml'

jobs:
  test:
    name: Test Go Application
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'
          cache-dependency-path: 'app_go/go.sum'

      - name: Install dependencies
        working-directory: ./app_go
        run: go mod download

      - name: Install Revive
        run: go install github.com/mgechev/revive@latest

      - name: Lint with Revive
        working-directory: ./app_go
        run: revive -config .revive.toml -formatter friendly ./...

      - name: Run tests
        working-directory: ./app_go
        run: go test -v -race -coverprofile=coverage.out -covermode=atomic ./...

      - name: Display coverage summary
        working-directory: ./app_go
        run: |
          echo "## Go Test Coverage Summary" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          go tool cover -func=coverage.out | tail -1 >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Detailed Coverage" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          go tool cover -func=coverage.out >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Generate coverage report
        working-directory: ./app_go
        run: go tool cover -html=coverage.out -o coverage.html

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          file: ./app_go/coverage.out
          flags: go
          name: go-coverage
          fail_ci_if_error: false

      - name: Run Snyk to check for vulnerabilities
        uses: snyk/actions/golang@master
        continue-on-error: true
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --severity-threshold=high --file=app_go/go.mod

  docker:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./app_go
          file: ./app_go/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/wordle-game:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/wordle-game:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push Distroless image
        uses: docker/build-push-action@v5
        with:
          context: ./app_go
          file: ./app_go/distroless.Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/wordle-game-distroless:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/wordle-game-distroless:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
