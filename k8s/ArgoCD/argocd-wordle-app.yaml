apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: wordle-game
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/escalopa/S25-core-course-labs.git
    targetRevision: lab-13
    path: k8s/wordle-game
    helm:
      valueFiles:
        - values.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
