# yamllint disable
apiVersion: v1
kind: Service
metadata:
  name: {{ include "moscow-time-app.fullname" . }}-headless
  labels:
    {{- include "moscow-time-app.labels" . | nindent 4 }}
spec:
  clusterIP: None
  selector:
    {{- include "moscow-time-app.selectorLabels" . | nindent 4 }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: http
