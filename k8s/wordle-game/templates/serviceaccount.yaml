{{- if .Values.serviceAccount.create -}}
# yamllint disable
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "wordle-game.serviceAccountName" . }}
  labels:
    {{- include "wordle-game.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: {{ .Values.serviceAccount.automount }}
{{- end }}
ad
