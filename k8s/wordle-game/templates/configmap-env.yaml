apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "wordle-game.fullname" . }}-env
  labels:
    {{- include "wordle-game.labels" . | nindent 4 }}
data:
  APP_CONFIG_ENV: "production"
  LOG_LEVEL: "info"
  FEATURE_FLAG_CACHE: "true"
  FEATURE_FLAG_PERSISTENCE: "true"
  FEATURE_FLAG_METRICS: "true"
  DB_CONNECTION_POOL_SIZE: "15"
  API_TIMEOUT: "30"
  SERVICE_PORT: "8080"
  GAME_MAX_ATTEMPTS: "6"
  GAME_DIFFICULTY: "medium"
